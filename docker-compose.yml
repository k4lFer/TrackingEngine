services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mineraltracking-postgres
    environment:
      POSTGRES_DB: mineral_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mineral_tracking"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: mineraltracking-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: mineraltracking-valhalla
    environment:
      tile_urls: "https://download.geofabrik.de/south-america/peru-latest.osm.pbf"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      build_elevation: "True"
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineraltracking-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_started
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__PostgresSQLConnectionString: "Host=postgres;Port=5432;Database=mineral_tracking;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      Redis__Configuration: "redis:6379"
      Redis__StreamKey: "gps:positions:stream"
      Redis__ConsumerGroup: "app-consumers"
      Redis__MaxLength: "100000"
      Routing__Valhalla__Enabled: "true"
      Routing__Valhalla__BaseUrl: "http://valhalla:8002"

  gps-gateway:
    build:
      context: .
      dockerfile: Dockerfile.GpsGateway
    container_name: mineraltracking-gps-gateway
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DOTNET_ENVIRONMENT: Docker
      Gps__Enabled: "true"
      Gps__TcpPort: "8090"
      Redis__Configuration: "redis:6379"
      Redis__StreamKey: "gps:positions:stream"
      Redis__ConsumerGroup: "app-consumers"
      Redis__MaxLength: "100000"
      ConnectionStrings__Redis: "redis:6379"
    restart: unless-stopped
    # GPS TCP listener vive EXCLUSIVAMENTE aquÃ­. NO escalar este servicio.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mineraltracking-frontend
    depends_on:
      - app
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: mineraltracking-nginx
    depends_on:
      - frontend
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  valhalla_tiles:
  redisdata:
